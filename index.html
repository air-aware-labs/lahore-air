<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lahore · AirTrack</title>
<meta name="description" content="Lahore, one winter day. Modelled at 500 metres.">
<meta property="og:title" content="Lahore · AirTrack">
<meta property="og:description" content="A winter morning in the city, modelled at 500 metres.">
<meta property="og:image" content="og.png">
<link rel="icon" href="favicon.svg">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root{
    --ink:#f4f0ea; --dim:rgba(244,240,234,.72); --accent:#c9a0ff;
    --glass:rgba(12,10,16,.52); --line:rgba(255,255,255,.12);
  }
  *{box-sizing:border-box}
  html,body,#map{height:100%;margin:0;background:#120e18}
  body{font-family:Georgia,"Iowan Old Style","Palatino Linotype",serif;color:var(--ink);overflow:hidden}
  #map{position:fixed;inset:0}
  .leaflet-control-attribution{background:transparent!important;color:rgba(255,255,255,.45);font:11px/1.3 system-ui,sans-serif;margin:0 10px 6px 0}
  .leaflet-control-attribution a{color:rgba(255,255,255,.55)}
  .leaflet-control-zoom{border:0!important;box-shadow:none!important;margin:18px 18px 0 0!important}
  .leaflet-control-zoom a{background:var(--glass)!important;color:var(--ink)!important;backdrop-filter:blur(12px);border:1px solid var(--line)!important;width:32px;height:32px;line-height:32px}
  .leaflet-control-zoom a:first-child{border-radius:10px 10px 0 0}
  .leaflet-control-zoom a:last-child{border-radius:0 0 10px 10px}

  .title{
    position:fixed;left:max(22px,env(safe-area-inset-left));top:max(20px,env(safe-area-inset-top));
    z-index:500;pointer-events:none;text-shadow:0 10px 40px rgba(0,0,0,.65);
  }
  .title .brand{font:600 11px/1 system-ui,sans-serif;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);margin:0 0 10px}
  .title h1{font-size:clamp(2.2rem,6vw,3.4rem);font-weight:600;letter-spacing:-.03em;margin:0;line-height:1}
  .title p{font:400 1.05rem/1.35 system-ui,sans-serif;margin:10px 0 0;color:var(--dim);max-width:28ch}

  .dock{
    position:fixed;left:50%;bottom:max(22px,env(safe-area-inset-bottom));
    transform:translateX(-50%);z-index:500;
    display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:center;
    background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
    border:1px solid var(--line);border-radius:999px;padding:8px 10px 8px 8px;
    box-shadow:0 18px 50px rgba(0,0,0,.35);
    font-family:system-ui,-apple-system,sans-serif;
  }
  .seg{display:flex;background:rgba(255,255,255,.06);border-radius:999px;padding:3px}
  .seg button,.play{
    appearance:none;border:0;background:transparent;color:var(--dim);
    font:600 13px system-ui,sans-serif;padding:7px 14px;border-radius:999px;cursor:pointer;
  }
  .seg button[aria-pressed="true"]{background:#fff;color:#1a1422}
  .play{
    width:38px;height:38px;padding:0;border-radius:50%;background:rgba(255,255,255,.1);color:#fff;
    display:grid;place-items:center;flex:none;
  }
  .play:hover{background:rgba(255,255,255,.18)}
  .clock{font:600 15px/1 ui-monospace,Menlo,monospace;min-width:4.6ch;text-align:center}
  #scrub{width:min(42vw,280px);accent-color:#c9a0ff;cursor:pointer}
  .credit{
    position:fixed;right:max(16px,env(safe-area-inset-right));bottom:max(16px,env(safe-area-inset-bottom));
    z-index:500;font:600 11px/1.2 system-ui,sans-serif;letter-spacing:.04em;
    color:rgba(244,240,234,.55);text-decoration:none;text-shadow:0 4px 16px #000;
  }
  .credit:hover{color:#fff}
  @media (max-width:640px){
    .title h1{font-size:2rem}
    .dock{width:calc(100% - 24px);border-radius:22px;padding:10px}
    #scrub{width:100%;flex:1 1 100%}
    .credit{display:none}
  }
</style>
</head>
<body>
<div id="map"></div>
<div class="title">
  <p class="brand">AirTrack</p>
  <h1>Lahore</h1>
  <p id="story">A winter morning in the city.</p>
</div>
<div class="dock">
  <div class="seg" role="tablist" aria-label="Season">
    <button type="button" id="btn-winter" aria-pressed="true">January</button>
    <button type="button" id="btn-june" aria-pressed="false">June</button>
  </div>
  <button type="button" class="play" id="play" aria-label="Play the day">
    <svg id="icon-play" width="14" height="14" viewBox="0 0 14 14" fill="currentColor"><path d="M3 1.5v11l9-5.5z"/></svg>
    <svg id="icon-pause" width="14" height="14" viewBox="0 0 14 14" fill="currentColor" hidden><path d="M3 2h3v10H3zm5 0h3v10H8z"/></svg>
  </button>
  <div class="clock" id="clock">09:00</div>
  <input id="scrub" type="range" min="0" max="23" value="9" aria-label="Hour">
</div>
<a class="credit" href="https://airawarelabs.com">Air Aware Labs</a>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const P = fetch("payload.json").then(r => r.json());
let season = "winter", hour = 9, playing = false, timer = null, overlay = null, map, payload;

function pad(n){ return String(n).padStart(2,"0"); }
function src(){ return `fields/${season}/${pad(hour)}.png`; }
function story(){
  document.getElementById("story").textContent = payload.story[season];
  document.getElementById("clock").textContent = pad(hour) + ":00";
  document.getElementById("scrub").value = hour;
  document.getElementById("btn-winter").setAttribute("aria-pressed", season === "winter");
  document.getElementById("btn-june").setAttribute("aria-pressed", season === "june");
}
function setFrame(h){
  hour = ((h % 24) + 24) % 24;
  if (overlay) overlay.setUrl(src());
  story();
}
function play(){
  playing = !playing;
  document.getElementById("icon-play").hidden = playing;
  document.getElementById("icon-pause").hidden = !playing;
  document.getElementById("play").setAttribute("aria-label", playing ? "Pause" : "Play the day");
  if (playing) {
    timer = setInterval(() => setFrame(hour + 1), 420);
  } else {
    clearInterval(timer);
  }
}

P.then(data => {
  payload = data;
  map = L.map("map", {
    zoomControl: false,
    attributionControl: true,
    minZoom: 11,
    maxZoom: 15,
  }).setView(data.center, 12);
  L.control.zoom({ position: "topright" }).addTo(map);
  L.tileLayer("https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png", {
    attribution: "&copy; OpenStreetMap &copy; CARTO",
    subdomains: "abcd",
    maxZoom: 19,
  }).addTo(map);
  overlay = L.imageOverlay(src(), data.bounds, { opacity: 1, interactive: false }).addTo(map);
  map.fitBounds(data.bounds, { padding: [24, 24] });
  story();
});

document.getElementById("btn-winter").onclick = () => { season = "winter"; setFrame(hour); };
document.getElementById("btn-june").onclick = () => { season = "june"; setFrame(hour); };
document.getElementById("play").onclick = play;
document.getElementById("scrub").oninput = e => setFrame(+e.target.value);
</script>
</body>
</html>
